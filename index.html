<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>웹툰 스튜디오 프로토타입</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header>
      <h1>만화/웹툰 제작 앱</h1>
      <p>원본 이미지 → 편집(컨트롤넷 포함) → 완성본 미리보기 워크플로우</p>
    </header>

    <main class="workspace">
      <section class="panel" aria-labelledby="source-title">
        <h2 id="source-title">1) 원본 이미지 영역</h2>

        <label for="prompt-input">기본 이미지 작성 프롬프트</label>
        <textarea
          id="prompt-input"
          placeholder="예: 감정이 살아있는 웹툰 주인공, 역동적인 구도, 한국식 도시 배경"
        ></textarea>

        <div class="tool-grid" role="group" aria-label="원본 이미지 생성 기능">
          <button type="button" data-style="스케치">스케치</button>
          <button type="button" data-style="펜터치">펜터치</button>
          <button type="button" data-style="컬러링">컬러링</button>
          <button type="button" data-style="베이직 컬러">베이직 컬러 적용</button>
          <button type="button" data-style="톤 보정">톤 보정</button>
          <button type="button" data-style="배경 생성">배경 생성</button>
        </div>

        <button id="apply-source" class="primary" type="button">원본 설정 반영</button>
        <div class="image-frame" id="source-preview" aria-live="polite"></div>
      </section>

      <section class="panel" aria-labelledby="edit-title">
        <h2 id="edit-title">2) 편집 영역 (Stable Diffusion + ControlNet)</h2>

        <div class="controls">
          <label for="controlnet-model">ControlNet 모델</label>
          <select id="controlnet-model">
            <option value="canny">Canny (윤곽선)</option>
            <option value="openpose">OpenPose (포즈)</option>
            <option value="depth">Depth (깊이)</option>
            <option value="lineart">Lineart (선화)</option>
          </select>

          <label for="controlnet-weight">ControlNet 강도</label>
          <input id="controlnet-weight" type="range" min="0" max="1" step="0.05" value="0.65" />

          <label for="denoise">Denoise 강도</label>
          <input id="denoise" type="range" min="0" max="1" step="0.05" value="0.45" />

          <label for="seed">Seed</label>
          <input id="seed" type="number" value="2026" />

          <label for="edit-notes">편집 지시 프롬프트</label>
          <textarea id="edit-notes" placeholder="예: 표정은 단호하게, 조명은 석양 톤, 선을 더 깔끔하게"></textarea>
        </div>

        <button id="apply-edit" class="primary" type="button">편집 적용</button>
        <div class="image-frame" id="edit-preview" aria-live="polite"></div>
      </section>

      <section class="panel" aria-labelledby="result-title">
        <h2 id="result-title">3) 완성 이미지 영역</h2>
        <p>좌측/중앙 설정을 반영해 최종 이미지를 시뮬레이션합니다.</p>
        <button id="render-result" class="primary" type="button">완성본 렌더링</button>
        <div class="image-frame large" id="result-preview" aria-live="polite"></div>
      </section>
    </main>

    <script src="app.js"></script>
  </body>
</html>
